name: CI

on:
  push:
    branches: [main, '*.x', 'x.*']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, pdo_mysql, mbstring
          tools: composer:v2
          coverage: none

      - name: Build OpenSwoole 26.2 (TLS, HTTP/2, curl hook)
        run: |
          # Same options as the documented installation; the HTTP client needs HTTP/2.
          sudo apt-get install -y --no-install-recommends libssl-dev libcurl4-openssl-dev
          curl -sSfL https://pecl.php.net/get/openswoole-26.2.0.tgz | tar xz
          cd openswoole-26.2.0
          phpize
          ./configure --enable-openssl --enable-http2 --enable-hook-curl
          make -j"$(nproc)"
          sudo make install
          echo "extension=openswoole" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/60-openswoole.ini"
          php --ri openswoole | grep -iE 'version|http2|openssl|curl'

      - name: Install MariaDB and Redis binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-server redis-server
          sudo systemctl stop mariadb redis-server || true

      - run: composer install --no-interaction --no-progress

      - run: composer validate --strict

      - name: Coding standards
        run: vendor/bin/php-cs-fixer check --diff

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Start test services
        run: bin/services up

      - name: Unit tests
        run: |
          mkdir -p var
          set +e
          php bin/omnitrix-phpunit --testsuite unit 2>&1 | tee var/unit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=unit tests::$(sed -n '/^There w/,$p' var/unit.log | head -80 | tr '\n' ' ' | cut -c1-8000)"
          fi
          exit "$status"

      - name: Integration tests
        run: |
          mkdir -p var
          set +e
          php bin/omnitrix-phpunit --testsuite integration 2>&1 | tee var/integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=integration tests::$(sed -n '/^There w/,$p' var/integration.log | head -80 | tr '\n' ' ' | cut -c1-8000)"
          fi
          exit "$status"

      - name: Stop test services
        if: always()
        run: bin/services down

  mysql:
    name: MySQL ${{ matrix.mysql }} (PHP 8.5)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    env:
      OMNITRIX_TEST_DB_ENGINE: mysql
      MYSQL_84: 8.4.11
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: redis, pdo_mysql, mbstring
          tools: composer:v2
          coverage: none

      - name: Build OpenSwoole 26.2 (TLS, HTTP/2, curl hook)
        run: |
          # Same options as the documented installation; the HTTP client needs HTTP/2.
          sudo apt-get install -y --no-install-recommends libssl-dev libcurl4-openssl-dev
          curl -sSfL https://pecl.php.net/get/openswoole-26.2.0.tgz | tar xz
          cd openswoole-26.2.0
          phpize
          ./configure --enable-openssl --enable-http2 --enable-hook-curl
          make -j"$(nproc)"
          sudo make install
          echo "extension=openswoole" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/60-openswoole.ini"
          php --ri openswoole | grep -iE 'version|http2|openssl|curl'

      - name: Install MySQL ${{ matrix.mysql }} and Redis binaries
        run: |
          sudo apt-get update
          if [ "${{ matrix.mysql }}" = "8.0" ]; then
            sudo apt-get install -y --no-install-recommends mysql-server redis-server
          else
            # Ubuntu packages only 8.0: use the official generic build (LTS). The CDN keeps only
            # the newest release; older ones move to the archive.
            sudo apt-get install -y --no-install-recommends redis-server libaio1t64 libnuma1
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
            file="mysql-${MYSQL_84}-linux-glibc2.28-x86_64-minimal.tar.xz"
            curl -sSfL "https://cdn.mysql.com/Downloads/MySQL-8.4/$file" -o "$RUNNER_TEMP/$file" \
              || curl -sSfL "https://downloads.mysql.com/archives/get/p/23/file/$file" -o "$RUNNER_TEMP/$file"
            mkdir -p "$RUNNER_TEMP/mysql" && tar -xJf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/mysql" --strip-components=1
            echo "$RUNNER_TEMP/mysql/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/mysql/bin/mysqld" --version
          fi
          sudo systemctl stop mysql redis-server || true
          sudo systemctl disable mysql || true
          # The packaged AppArmor profile only allows /var/lib/mysql; bin/services uses var/mysql.
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo ln -sf /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
          fi

      - run: composer install --no-interaction --no-progress

      - name: Start test services
        run: |
          if ! bin/services up; then
            for f in var/mysql/install.log var/mysql/error.log; do
              [ -f "$f" ] && echo "::error title=$f::$(tail -n 25 "$f" | tr '\n' ' ' | cut -c1-3000)"
            done
            exit 1
          fi

      - name: Integration tests
        run: |
          mkdir -p var
          set +e
          php bin/omnitrix-phpunit --testsuite integration 2>&1 | tee var/integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Annotations are capped at 4 KiB: one line per failed test (name + first message line).
            for kind in error failure; do
              echo "::error title=${kind}s::$(sed -n "/^There w[a-z]* [0-9]* ${kind}/,/^There w\|^FAILURES\|^ERRORS/p" var/integration.log | awk '/^[0-9]+\) /{n=$0; getline m; print n " :: " m}' | head -40 | tr '\n' ' ' | cut -c1-4000)"
            done
            if [ -f var/mysql/mariadbd.pid ] && kill -0 "$(cat var/mysql/mariadbd.pid)" 2>/dev/null; then state=alive; else state=gone; fi
            echo "::error title=mysqld after tests ($state)::$(tail -n 30 var/mysql/error.log 2>/dev/null | tr '\n' ' ' | cut -c1-4000)"
            echo "::error title=first test output::$(grep -m1 -n -iE 'refused|gone away|lost connection' var/integration.log | cut -c1-300) :: $(head -c 2500 var/integration.log | tr '\n' ' ')"
          fi
          exit "$status"

      - name: Stop test services
        if: always()
        run: bin/services down

